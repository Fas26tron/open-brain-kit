# Supabase CLI configuration for the Open Brain kit.
#
# Only the parts that matter for deployment are set here; the CLI fills in the
# rest with defaults. `project_id` is a local label, NOT your project ref —
# the ref is bound with `supabase link --project-ref <ref>`.
project_id = "open-brain"

[db]
major_version = 17

[db.migrations]
enabled = true

# All three Edge Functions authenticate with their own access key
# (`x-brain-key` header or `?key=` query param), NOT with a Supabase JWT.
# `verify_jwt = false` is therefore REQUIRED: with the default (true) every
# request from Claude / ChatGPT / the Chrome extension is rejected with 401.
# Pinning it here means `supabase functions deploy` never needs the
# `--no-verify-jwt` flag (and cannot forget it).

[functions.open-brain-mcp]
enabled = true
verify_jwt = false
import_map = "./functions/open-brain-mcp/deno.json"

[functions.open-brain-rest]
enabled = true
verify_jwt = false
import_map = "./functions/open-brain-rest/deno.json"

[functions.ob-graph-mcp]
enabled = true
verify_jwt = false
import_map = "./functions/ob-graph-mcp/deno.json"

[functions.open-brain-advisors]
enabled = true
verify_jwt = false
import_map = "./functions/open-brain-advisors/deno.json"
